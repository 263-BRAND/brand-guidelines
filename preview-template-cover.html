<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>263 Template Cover</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#F2F2F2; }

#slide {
  width:100vw; height:100vh;
  position:relative; overflow:hidden;
  background:#F2F2F2;
  font-family:"微软雅黑","Microsoft YaHei",sans-serif;
}

#ascii-logo {
  position:absolute; top:clamp(36px, 9%, 96px); left:50%;
  transform:translateX(-50%);
  z-index:5;
  white-space:pre;
  font-family:"Courier New","Source Code Pro","Consolas",monospace;
  font-size:clamp(5px, 0.55vw, 11px);
  line-height:0.6;
  color:#D0121B;
  user-select:none;
}

.ascii-line {
  display:block;
  opacity:0;
  animation: slideIn 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}

.ascii-line.odd  { animation-name: slideInLeft; }
.ascii-line.even { animation-name: slideInRight; }

@keyframes slideInLeft {
  from { opacity:0; transform:translateX(-60px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes slideInRight {
  from { opacity:0; transform:translateX(60px); }
  to   { opacity:1; transform:translateX(0); }
}

#content {
  position:absolute;
  top:calc(clamp(36px, 9%, 96px) + clamp(170px, 36vh, 390px));
  left:50%; transform:translateX(-50%);
  text-align:center;
  z-index:10;
  width:80%;
  opacity:0;
  animation: fadeUp 0.8s 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateX(-50%) translateY(20px); }
  to   { opacity:1; transform:translateX(-50%) translateY(0); }
}

h1 {
  font-size:clamp(28px, 3.5vw, 56pt);
  font-weight:bold; color:#2D3847;
  letter-spacing:3px;
  margin-bottom:clamp(14px, 1.8vh, 24px);
}

#meta {
  font-size:clamp(18px, 2vw, 26pt);
  color:#999;
  display:flex; gap:clamp(20px, 3vw, 56px);
  justify-content:center;
}

.meta-dot { color:#D0121B; opacity:0.5; }

#company {
  position:absolute; bottom:clamp(24px, 5%, 54px); left:0; width:100%;
  text-align:center;
  font-size:clamp(12px, 1.2vw, 18pt);
  color:rgba(89,89,89,0.45);
  z-index:10;
  opacity:0;
  animation: fadeUp 0.6s 1.5s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}
</style>
</head>
<body>
<div id="slide">
  <div id="ascii-logo"></div>

  <div id="content">
    <h1>Q3 季度工作汇报</h1>
    <div id="meta">
      <span>汇报人：郭悦</span>
      <span class="meta-dot">·</span>
      <span>品牌行政部</span>
    </div>
  </div>

  <div id="company">二六三网络通信股份有限公司</div>
</div>

<script>
(function(){
  var lines = [
    "                                         ▓▓▓▓▓▒",
    "                                  ▓▓██████████████▓",
    "                              ██████████████████████▓",
    "                          ▓███████████████████████████",
    "                       ▒██████████████████████████████▒",
    "                     ▓█████████████████████████████████",
    "                   ████████████████████████████████████",
    "                 ██████████████████████████████████████",
    "                ███████████████████████████████████████",
    "               ▒███████████████████████████████████████",
    "               ████████████████████████████████████████",
    "               ████████████████████████████████████████",
    "               ███████████████████████████████████████▓",
    "               ▓███▓▓▓▓▓▓▓▓▓▓█▓▓▓██▓▓▓▓▓▓█▓▓▓▓▓▓▓▓▓▓██",
    "               ▒███          █   █      ██          ██",
    "               ▒██████████   █   █▓▓▓▓▓▓█████████   █",
    "                ██          ▓▓          █▓         ▒█",
    "                ██          █           █▒         ▓▒",
    "                ▒█  ▒████████   █████   ████████   ▓",
    "                 ▒         ▓█          ▒▓         ▒",
    "                 ▓         ██         ▓█▓▒▒      ▓▒",
    "                 ▓███████████████████████████████▓",
    "                  ███████████████████████████████",
    "                  ██████████████████████████████",
    "                   ████████████████████████████▒",
    "                   ███████████████████████████▓",

  ];

  var container = document.getElementById('ascii-logo');
  var delay = 0;
  for (var i = 0; i < lines.length; i++) {
    var span = document.createElement('span');
    span.className = 'ascii-line ' + (i % 2 === 0 ? 'even' : 'odd');
    span.textContent = lines[i];
    span.style.animationDelay = delay + 's';
    container.appendChild(span);
    delay += 0.03;
  }
})();
</script>
</body>
</html>
